name: Testing Tasks Week 04

env:
  WEEK: &week week_04

on:
  workflow_dispatch:
    inputs:
      task:
        description: 'Select tasks to test'
        required: true
        type: choice
        default: 'all'
        options:
          - all
          - stack
          - queue
          - ring_buffer
          - phasor

  schedule:
    - cron: '59 20 06 11 *'  # UTC: 20:59 = 23:59 MSK 6 November

jobs:
  test:
    uses: ./.github/workflows/run_tests.yml
    with:
      week: *week
      task: ${{ github.event_name == 'schedule' && 'all' || inputs.task }}